<!-- Campo de Código Postal para filtrar a zona -->
<div class="mb-3">
    <label for="codigoPostal" class="form-label">Código Postal *</label>
    <input type="text" class="form-control" id="codigoPostal" placeholder="Ex: 2900-474" required>
</div>

<!-- Campo do Nome do Espaço / Estabelecimento com Autocomplete -->
<div class="mb-3 position-relative">
    <label for="nomeEspaco" class="form-label">Nome do espaço / estabelecimento *</label>
    <input type="text" class="form-control" id="nomeEspaco" placeholder="Comece a escrever o nome do espaço..." autocomplete="off" required>
    <!-- Caixa onde vão aparecer as sugestões em tempo real -->
    <div id="sugestoesEspacos" class="list-group position-absolute w-100 shadow-sm" style="z-index: 1000; max-height: 200px; overflow-y: auto;"></div>
</div>

<!-- Script JavaScript para interagir com a API do Nominatim em tempo real -->
<script>
document.getElementById('nomeEspaco').addEventListener('input', function() {
    let query = this.value;
    let codigoPostal = document.getElementById('codigoPostal').value;
    let sugestoesBox = document.getElementById('sugestoesEspacos');
    
    // Só pesquisa se o utilizador escrever pelo menos 3 letras
    if (query.length < 3) {
        sugestoesBox.innerHTML = '';
        return;
    }

    // Combina o termo de pesquisa com o código postal (se preenchido) para afunilar a zona
    let termoPesquisa = codigoPostal ? `${query} ${codigoPostal}` : `${query} Setubal Portugal`;
    let url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(termoPesquisa)}&limit=5&countrycodes=pt`;

    fetch(url)
        .then(response => response.json())
        .then(data => {
            sugestoesBox.innerHTML = '';
            data.forEach(local => {
                let item = document.createElement('a');
                item.href = '#';
                item.className = 'list-group-item list-group-item-action';
                item.innerText = local.display_name;
                
                // Ao clicar numa sugestão, preenche o campo automaticamente
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    document.getElementById('nomeEspaco').value = local.display_name;
                    sugestoesBox.innerHTML = '';
                });
                
                sugestoesBox.appendChild(item);
            });
        })
        .catch(err => console.error('Erro ao procurar moradas:', err));
});

// Fecha a caixa de sugestões se clicar fora
document.addEventListener('click', function(e) {
    if (!document.getElementById('nomeEspaco').contains(e.target)) {
        document.getElementById('sugestoesEspacos').innerHTML = '';
    }
});
</script>
